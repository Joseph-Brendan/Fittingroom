<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        color: #16181d;
        background: #ffffff;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
      }

      p {
        margin: 0 0 24px;
        color: #5f6368;
      }

      a {
        display: inline-block;
        min-height: 44px;
        border-radius: 6px;
        padding: 12px 18px;
        background: #0b57d0;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Simple pricing</h1>
      <p>One plan for every project. Cancel when you need to.</p>
      <a href="/signup">Start a project</a>
    </main>
  </body>
</html>
