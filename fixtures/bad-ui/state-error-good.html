<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Projects</h1>
      <div id="projects">Loading projects.</div>
    </main>
    <script>
      function load() {
        fetch("/api/projects")
          .then((response) => {
            if (!response.ok) throw new Error("Request failed");
            return response.json();
          })
          .then((projects) => {
            document.getElementById("projects").textContent = `${projects.length} projects`;
          })
          .catch(() => {
            document.getElementById("projects").innerHTML =
              '<p>Could not load projects.</p><button type="button">Try again</button>';
          });
      }
      load();
    </script>
  </body>
</html>
