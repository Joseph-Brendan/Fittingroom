<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        color: #16181d;
        background: #ffffff;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
      }

      p {
        margin: 0 0 24px;
        color: #5f6368;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      input {
        width: 100%;
        min-height: 44px;
        margin-bottom: 20px;
        border: 1px solid #74777d;
        border-radius: 6px;
        padding: 8px 12px;
        font: inherit;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        padding: 12px 18px;
        background: #0b57d0;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Log in</h1>
      <p>Use your work email to open your account.</p>
      <form>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" />
        <button type="button">Log in</button>
      </form>
    </main>
  </body>
</html>
