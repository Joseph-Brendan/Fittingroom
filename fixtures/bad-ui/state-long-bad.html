<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>
    <style>
      body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; }
      #projects { width: 620px; white-space: nowrap; overflow: hidden; }
    </style>
  </head>
  <body>
    <main>
      <h1>Projects</h1>
      <div id="projects">Loading projects.</div>
    </main>
    <script>
      fetch("/api/projects")
        .then((response) => response.json())
        .then((projects) => {
          const root = document.getElementById("projects");
          root.textContent = projects.map((project) => `${project.name}: ${project.description}`).join(" ");
        });
    </script>
  </body>
</html>
