<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>Settings</h1>
      <p>Manage this project and its saved changes.</p>
      <button id="delete-project" class="danger" type="button" data-confirm="Delete this project?">
        Delete project
      </button>
      <button id="save-changes" type="button" data-state="saved">Save changes</button>
      <p id="save-status" role="status">Saved</p>
      <script>
        document.getElementById("delete-project")?.addEventListener("click", () => {
          const button = document.getElementById("delete-project");

          if (button?.getAttribute("data-confirm") === "Delete this project?" && confirm("Delete this project?")) {
            document.getElementById("save-status").textContent = "Project deleted.";
          }
        });

        document.getElementById("save-changes")?.addEventListener("click", () => {
          document.getElementById("save-status").textContent = "Saved";
        });
      </script>
      <nav class="site-nav" aria-label="Pages">
        <a href="/">Home</a>
        <a href="/pricing">Pricing</a>
        <a href="/login">Log in</a>
        <a href="/signup">Sign up</a>
        <a href="/onboarding">Onboarding</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/analytics">Analytics</a>
        <a href="/reports">Reports</a>
        <a href="/settings">Settings</a>
        <a href="/checkout">Checkout</a>
      </nav>
    </main>
  </body>
</html>
