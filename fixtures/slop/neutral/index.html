<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northstar workspace</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: #ffffff; color: #16181d; font-family: Arial, sans-serif; }
      main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
      h1 { font-size: 34px; font-weight: 700; margin: 0 0 12px; }
      h2 { font-size: 24px; font-weight: 700; margin: 0 0 10px; }
      p { font-size: 16px; font-weight: 400; margin: 0 0 16px; }
      button { min-height: 44px; padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #16181d; font: inherit; }

    </style>
  </head>
  <body>
    <main>
      <h1>Northstar workspace</h1>
      <p>Plan the week with your team and keep the work moving.</p>
      <p><a href="/login">Sign in</a></p>
      <section>
        <h2>Shared plans</h2>
        <p>Every project has one clear owner and a short list of next steps.</p>
        <button type="button">Open the guide</button>
      </section>
    </main>
  </body>
</html>
