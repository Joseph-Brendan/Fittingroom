<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design review</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: #ffffff; color: #16181d; font-family: Arial, sans-serif; }
      main { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
      h1 { font-size: 34px; font-weight: 700; margin: 0 0 12px; }
      h2 { font-size: 24px; font-weight: 700; margin: 0 0 10px; }
      p { font-size: 16px; font-weight: 400; margin: 0 0 16px; }
      button { min-height: 44px; padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; color: #16181d; font: inherit; }

      .glow { background-image: linear-gradient(90deg, #8b5cf6, #2563eb); color: #ffffff; box-shadow: 0 0 28px #8b5cf6; }

    </style>
  </head>
  <body>
    <main>
      <h1>Northstar workspace</h1>
      <p>Choose a plan and start in minutes.</p>
      <button class="glow" type="button">Start free</button>
      <button class="glow" type="button">Book a demo</button>
      <button class="glow" type="button">Talk to sales</button>
    </main>
  </body>
</html>
