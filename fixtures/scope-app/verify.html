<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify email</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        color: #16181d;
        background: #ffffff;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 48px 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
      }

      p {
        margin: 0 0 24px;
        color: #5f6368;
      }

      button {
        min-height: 44px;
        border: 0;
        border-radius: 6px;
        padding: 12px 18px;
        background: #0b57d0;
        color: #ffffff;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Verify your email</h1>
      <p>We sent a verification link to your work email.</p>
      <button type="button">Resend link</button>
    </main>
  </body>
</html>
